allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true

overrides:
  'brace-expansion@>=4.0.0 <5.0.9': '>=5.0.9'
  'brace-expansion@>=2.0.0 <2.1.4': '>=2.1.4'
  'minimatch@5.1.9>brace-expansion': '>=5.0.9'
  # Patch GHSA-2v37-7h3g-55p8 (nanoid < 3.3.17), pulled in transitively via
  # postcss. Constrained to the 3.x line — postcss uses nanoid@^3.3.x and
  # nanoid 4+ is ESM-only, so a cross-major bump would break the build.
  'nanoid@<3.3.17': '^3.3.17'
